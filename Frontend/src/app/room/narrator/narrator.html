<button
  type="button"
  class="narrator"
  [class.speaking]="open()"
  [attr.aria-expanded]="open()"
  [attr.aria-label]="'Narrador: ' + heading() + '. ' + (open() ? 'Ocultar' : 'Volver a contar')"
  (click)="toggle()"
>
  <span class="face" aria-hidden="true">🧙</span>
  <span class="caption">
    @if (eyebrow(); as eyebrow) {
      <span class="eyebrow">{{ eyebrow }}</span>
    }
    <span class="title">{{ phase().icon }} {{ title() }}</span>
  </span>
</button>

@if (open()) {
  <div class="bubble" role="status" animate.leave="leaving" (click)="hide()">
    <p class="bubble-title">{{ phase().icon }} {{ heading() }}</p>
    <p class="narration">{{ phase().narration }}</p>
    @for (line of lines(); track $index) {
      <p class="line"><span aria-hidden="true">{{ line.icon }}</span> {{ line.text }}</p>
    }
  </div>
}
