<ul class="grid">
  @for (p of players(); track p.id) {
    @let canPick = selectable().has(p.id);
    @let isSelected = selected().includes(p.id);
    @let pVoters = voters().get(p.id);
    <li [class.has-voters]="!!pVoters">
      <button
        type="button"
        class="player"
        [class.dead]="!p.alive"
        [class.me]="p.id === meId()"
        [class.pickable]="canPick"
        [class.selected]="isSelected"
        [class.voted]="p.id === myVote()"
        [disabled]="!canPick"
        [attr.aria-pressed]="canPick ? isSelected : null"
        (click)="pick.emit(p.id)"
      >
        <span class="avatar" [style.background]="p.alive ? color(p.name) : null">
          {{ p.alive ? initial(p.name) : '💀' }}
        </span>
        <span class="info">
          <span class="name">
            <span class="name-text">{{ p.name }}</span>
            @if (p.id === meId()) {
              <span class="tag">tú</span>
            }
          </span>
          @if (p.role) {
            <span class="role" [class.wolf]="isWolf(p.role)">{{ icon[p.role] }} {{ roleName(p.role) }}</span>
          } @else {
            <span class="role muted">¿?</span>
          }
        </span>
        <span class="badges">
          @if (p.lover) {
            <span title="Enamorado" aria-label="Enamorado">💘</span>
          }
          @if (ready().has(p.id)) {
            <span title="Quiere votar" aria-label="Quiere votar">✋</span>
          }
          @if (offline().has(p.id)) {
            <span title="Desconectado" aria-label="Desconectado">📴</span>
          }
        </span>
      </button>
      @if (pVoters) {
        @let open = expanded().has(p.id);
        <button
          type="button"
          class="voters"
          [class.open]="open"
          [attr.aria-expanded]="open"
          [attr.aria-label]="(open ? 'Ocultar' : 'Ver') + ' quién vota a ' + p.name"
          (click)="toggleVoters(p.id)"
        >
          <span class="voters-names">
            @if (open) {
              Le {{ pVoters.length === 1 ? 'vota' : 'votan' }}: {{ pVoters.join(', ') }}
            } @else {
              ← {{ pVoters.join(', ') }}
            }
          </span>
          <span class="count" [attr.aria-label]="pVoters.length + (pVoters.length === 1 ? ' voto' : ' votos')">
            {{ pVoters.length }}
          </span>
          <span class="chevron" aria-hidden="true">{{ open ? '▴' : '▾' }}</span>
        </button>
      }
    </li>
  }
</ul>
