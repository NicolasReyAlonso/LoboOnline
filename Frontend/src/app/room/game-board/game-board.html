<main class="board" [class.chat-open]="chatOpen()" [class.has-hand]="!!myCard()">
  <header class="top">
    <app-narrator class="narrator" />
    <app-phase-clock class="clock" [endsAt]="view().endsAt" [startedAt]="view().timerStartedAt" />
    <div class="sky" [class.day]="game.theme() === 'day'" aria-hidden="true">
      <span class="moon"></span>
      <span class="sun"></span>
    </div>
  </header>

  @if (ended()) {
    <section class="stage end">
      <app-end-screen />
    </section>
  } @else {
    <div class="action">
      <app-action-panel [(selected)]="selected" />
    </div>
    <section class="stage" aria-label="Jugadores">
      <app-player-carousel [cards]="others()" (pick)="onPick($event)" />
    </section>
  }

  <footer class="dock">
    @if (myCard(); as card) {
      <app-player-card class="mine" [card]="card" (pick)="onPick(card.player.id)" />
      <!-- Hueco para tu carta de personaje (app-role-card), que va fija encima. -->
      <span class="hand-slot" aria-hidden="true"></span>
    }

    <nav class="buttons" aria-label="Paneles">
      <div class="sheet-anchor">
        <button
          type="button"
          class="round"
          [class.active]="sheet() === 'composition'"
          [attr.aria-expanded]="sheet() === 'composition'"
          (click)="toggleSheet('composition')"
        >
          <span class="icon" aria-hidden="true">🎴</span>
          <span class="cap">Reparto</span>
        </button>
        <button
          type="button"
          class="round"
          [class.active]="sheet() === 'chronicle'"
          [attr.aria-expanded]="sheet() === 'chronicle'"
          (click)="toggleSheet('chronicle')"
        >
          <span class="icon" aria-hidden="true">📜</span>
          <span class="cap">Crónica</span>
        </button>

        @if (sheet(); as section) {
          <section class="sheet panel" animate.leave="leaving">
            <button type="button" class="icon-btn close" aria-label="Cerrar" (click)="sheet.set(null)">✕</button>
            <app-game-log [section]="section" />
          </section>
        }
      </div>

      <button
        type="button"
        class="round"
        [class.active]="chatOpen()"
        [attr.aria-expanded]="chatOpen()"
        (click)="toggleChat()"
      >
        <span class="icon" aria-hidden="true">💬</span>
        <span class="cap">Chat</span>
        @if (unreadChat() > 0) {
          <span class="badge" [attr.aria-label]="unreadChat() + ' mensajes sin leer'">{{ unreadChat() }}</span>
        }
      </button>
    </nav>
  </footer>

  <!-- Siempre montado (se oculta con CSS) para no perder el canal elegido ni los no leídos. -->
  <aside class="chat panel" [class.open]="chatOpen()" [attr.aria-hidden]="!chatOpen()" aria-label="Chat">
    <button type="button" class="icon-btn close" aria-label="Plegar el chat" (click)="toggleChat()">✕</button>
    <app-chat />
  </aside>

  <app-role-card />
</main>
